<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>إتمام الشراء - موتور ستور</title>
    <link rel="icon" type="image/png" href="../images/Favicon.png"> 
    <link rel="stylesheet" href="../master.css"> 
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css" />

    <link rel="stylesheet" href="checkout-styles.css">
</head>
<body>
    
    <header class="checkout-page-header">
        <div class="checkout-header-content container">
            <div class="logo">
                <img src="../images/icon.png?v=2" alt="Motor Store Logo" width="40" height="40" /> 
                <div class="brand-name-wrapper">
                    <span class="brand-name">موتور</span>
                    <span class="brand-name-accent">ستور</span>
                </div>
            </div>
            <a href="../index.html" class="checkout-return-btn">
                <i class="fa-solid fa-arrow-right"></i> <span>العودة للتسوق</span>
            </a>
        </div>
    </header>

    <main>
        <div class="container">
            <div class="main-checkout card">
                <div class="checkout-header">
                    <h2><i class="fa-solid fa-file-invoice-dollar"></i> تفاصيل الطلب والدفع</h2>
                </div>
                
                <div class="checkout-grid">
                    
                    <div class="products-section">
                        
                        <div class="form-section">
                            <h3>1. بيانات التوصيل</h3>
                            <form id="shippingForm">
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="fullName">الاسم بالكامل</label>
                                        <input type="text" id="fullName" name="fullName" required placeholder="محمد أحمد" />
                                    </div>
                                    <div class="form-group">
                                        <label for="phone">رقم الهاتف</label>
                                        <input type="tel" id="phone" name="phone" required pattern="[0-9]{11}" maxlength="11" placeholder="01XXXXXXXXX" />
                                    </div>
                                </div>
                                <div class="form-group">
                                    <label for="address">العنوان التفصيلي</label>
                                    <input type="text" id="address" name="address" required placeholder="المنطقة، الشارع، رقم المبنى، الدور، الشقة" />
                                </div>
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="city">المحافظة</label>
                                        <input type="text" id="city" name="city" required placeholder="القاهرة" />
                                    </div>
                                    <div class="form-group">
                                        <label for="area">المنطقة/الحي</label>
                                        <input type="text" id="area" name="area" required placeholder="مدينة نصر" />
                                    </div>
                                </div>
                                <p style="font-size: 0.85em; color: var(--muted); margin-top: -10px;">سيتم التواصل معك لتأكيد العنوان قبل الشحن.</p>
                            </form>
                        </div>

                        <div class="form-section">
                            <h3>2. طريقة الدفع</h3>
                            <div class="payment-methods">
                                <div class="payment-option selected" data-method="cod">
                                    <input type="radio" id="cod" name="paymentMethod" value="cod" checked>
                                    <label for="cod"><i class="fa-solid fa-hand-holding-dollar"></i> الدفع عند الاستلام (Cash on Delivery)</label>
                                </div>
                                <div class="payment-option" data-method="visa">
                                    <input type="radio" id="visa" name="paymentMethod" value="visa">
                                    <label for="visa"><i class="fa-solid fa-credit-card"></i> فيزا / ماستركارد (بطاقة ائتمانية)</label> 
                                </div>
                            </div>
                            
                            <div id="creditCardDetails" class="card-details-form" style="display: none;">
                                <h4 style="font-size: 1.1em; color: var(--primary-dark); margin-bottom: 15px; font-weight: 700;">بيانات البطاقة</h4>

                                <div class="form-group card-number-group">
                                    <label for="cardNumber">رقم البطاقة الائتمانية</label>
                                    <div class="input-with-icon">
                                        <input type="text" id="cardNumber" name="cardNumber" pattern="[0-9\s]{13,19}" maxlength="19" placeholder="XXXX XXXX XXXX XXXX" required disabled />
                                        <i id="cardTypeIcon" class="card-icon" style="display:none;"></i> 
                                    </div>
                                </div>
                                
                                <div class="form-row">
                                    <div class="form-group">
                                        <label for="cardExpiry">تاريخ الانتهاء</label>
                                        <input type="text" id="cardExpiry" name="cardExpiry" pattern="(0[1-9]|1[0-2])\/\d{2}" maxlength="5" placeholder="MM/YY" required disabled />
                                    </div>
                                    <div class="form-group">
                                        <label for="cardCVC">رمز الأمان (CVC)</label>
                                        <input type="text" id="cardCVC" name="cardCVC" pattern="\d{3,4}" maxlength="4" placeholder="XXX" required disabled />
                                    </div>
                                </div>
                            </div>
                        </div>

                        <div class="form-section">
                            <h3 style="border-bottom: none; margin-bottom: 0;">3. مراجعة سريعة للمنتجات</h3>
                            <div id="checkoutProductsList">
                                </div>
                        </div>
                        
                    </div>
                    
                    <div class="summary-section">
                        <h3>ملخص الطلب</h3>
                        <div class="summary-details">
                            <div class="summary-row">
                                <span>إجمالي المنتجات:</span>
                                <span id="subtotalAmount">0.00 ج.م</span>
                            </div>
                            <div class="summary-row">
                                <span>رسوم الشحن:</span>
                                <span id="shippingFee">50.00 ج.م</span>
                            </div>
                            <div class="summary-total summary-row">
                                <span>المجموع الكلي:</span>
                                <span id="totalAmount">0.00 ج.م</span>
                            </div>
                        </div>
                        
                        <div id="paymentAlert" class="error-message" style="display: none;">الرجاء تحديد طريقة الدفع!</div>
                        <div id="cartAlert" class="error-message" style="display: none;">سلة المشتريات فارغة!</div>

                        <button class="confirm-btn" id="confirmPurchaseBtn" type="button">
                            تأكيد الطلب والدفع
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </main>
    
    <script src="checkout-logic.js"></script>
</body>
</html>
